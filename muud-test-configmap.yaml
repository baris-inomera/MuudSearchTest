    def tr_lower(s):
        if not s: return ""
        return s.replace("\u0130", "i").replace("I", "\u0131").lower()

    def contains_tr(actual, expected):
        if not expected: return True
        if not actual: return False
        if tr_lower(expected) in tr_lower(actual): return True
        # Fallback: bracket/boşluk sil + ı→i (API "Saygi1" ↔ expected "saygı 1")
        def flat(s): return s.replace('ı','i').replace('[','').replace(']','').replace(' ','').lower()
        fe, fa = flat(expected), flat(actual)
        return bool(fe) and fe in fa

    def equals_tr(actual, expected):
        if not expected: return True
        if not actual: return False
        import unicodedata
        a = unicodedata.normalize("NFC", actual.strip())
        e = unicodedata.normalize("NFC", expected.strip())
        return tr_lower(a) == tr_lower(e) or a.lower() == e.lower()

    def get_artist(d):
        return d.get("performerName") or d.get("performerNames") or ""

    def search_api(term, n):
        body = {"text": term, "filters": None, "fields": None,
                "suggestion": True, "correction": True, "limit": n, "offset": 0}
        try:
            r = requests.post(API_URL, json=body, headers=HEADERS, verify=False, timeout=15)
            d = r.json()
            return d.get("topHits") or d.get("content") or []
        except Exception as e:
            print(f"  API HATA '{term}': {e}")
            return None

    def find_artist(items, n, exp):
        for i, it in enumerate(items[:n]):
            d = it.get("data", {})
            if d.get("kind") != "performers": continue
            if equals_tr(get_artist(d), exp): return i
        return -1

    def find_track(items, n, exp_a, exp_t):
        for i, it in enumerate(items[:n]):
            d = it.get("data", {})
            artist = get_artist(d)
            track = d.get("songName") or d.get("albumName") or d.get("playlistName") or get_artist(d) or ""
            if (not exp_a or contains_tr(artist, exp_a)) and (not exp_t or contains_tr(track, exp_t) or contains_tr(artist, exp_t)):
                return i
        return -1

    def find_playlist(items, n, kw):
        for i, it in enumerate(items[:n]):
            d = it.get("data", {})
            for f in ["albumName", "playlistName", "songName"]:
                if contains_tr(d.get(f, ""), kw): return i
            if contains_tr(get_artist(d), kw): return i
        return -1

    def evaluate(cid, term, exp_a, exp_t, section, top_n, items):
        if items is None: return "NOK", "API hatasi"
        if not items: return "NOK", "Sonuc donmedi"
        if exp_t.startswith("[Playlist] "):
            kw = exp_t[len("[Playlist] "):]
            pos = find_playlist(items, top_n, kw)
            if pos != -1: return "OK", f"{pos+1}. sirada '{kw}' bulundu"
            return "NOK", f"Ilk {top_n}'da '{kw}' iceren kayit yok"
        if exp_a and not exp_t:
            pos = find_artist(items, top_n, exp_a)
            if pos != -1:
                return "OK", f"{pos+1}. sirada '{get_artist(items[pos].get('data', {}))}'"
            pos2 = find_artist(items, TOP_N, exp_a)
            where = f"{pos2+1}. sirada" if pos2 != -1 else f"top-{TOP_N}'da bulunamadi"
            d0 = items[0].get("data", {})
            return "NOK", f"'{exp_a}' yok ({where}). 1.sira: '{get_artist(d0)}' - '{d0.get('songName') or d0.get('albumName', '?')}'"
        pos = find_track(items, top_n, exp_a, exp_t)
        if pos != -1:
            d = items[pos].get("data", {})
            return "OK", f"{pos+1}. sirada '{d.get('songName') or d.get('albumName', '?')}' [{get_artist(d)}]"
        pos2 = find_track(items, TOP_N, exp_a, exp_t)
        where = f"{pos2+1}. sirada" if pos2 != -1 else f"top-{TOP_N}'da bulunamadi"
        d0 = items[0].get("data", {})
        return "NOK", f"'{exp_t}' yok ({where}). 1.sira: '{d0.get('songName') or d0.get('albumName', '?')}' [{get_artist(d0)}]"

    def write_excel(results):
        wb = openpyxl.Workbook()
        ws = wb.active
        ws.title = "Tum Testler"
        ok_fill    = PatternFill("solid", fgColor="C8E6C9")
        nok_fill   = PatternFill("solid", fgColor="FFCDD2")
        hdr_fill   = PatternFill("solid", fgColor="1F5C99")
        total_fill = PatternFill("solid", fgColor="2E75B6")
        thin = Border(
            left=Side(style="thin", color="CCCCCC"),
            right=Side(style="thin", color="CCCCCC"),
            top=Side(style="thin", color="CCCCCC"),
            bottom=Side(style="thin", color="CCCCCC"))
        ok_count = sum(1 for r in results if r[6] == "OK")
        total = len(results)
        pct = round(ok_count / total * 100) if total else 0
        sec_ok  = Counter(r[4] for r in results if r[6] == "OK")
        sec_nok = Counter(r[4] for r in results if r[6] == "NOK")
        secs = sorted(set(list(sec_ok) + list(sec_nok)))
        ws.append(["MUUD TEST SONUC OZETI - TUM TESTLER", "", "", "", ""])
        ws.merge_cells("A1:E1")
        c = ws.cell(1, 1)
        c.font = Font(bold=True, color="FFFFFF", size=13)
        c.fill = hdr_fill
        c.alignment = Alignment(horizontal="center", vertical="center")
        ws.row_dimensions[1].height = 22
        ws.append(["Kategori", "Toplam", "Basarili", "Hata", "Basari Orani"])
        for col in range(1, 6):
            c = ws.cell(2, col)
            c.font = Font(bold=True, color="FFFFFF", size=11)
            c.fill = hdr_fill
            c.alignment = Alignment(horizontal="center", vertical="center")
            c.border = thin
        for s in secs:
            ok_c  = sec_ok.get(s, 0)
            tot_c = ok_c + sec_nok.get(s, 0)
            p = round(ok_c / tot_c * 100) if tot_c else 0
            ws.append([s, tot_c, ok_c, tot_c - ok_c, f"%{p}"])
            f = ok_fill if p >= 80 else nok_fill
            for col in range(1, 6):
                c = ws.cell(ws.max_row, col)
                c.fill = f
                c.alignment = Alignment(horizontal="left" if col == 1 else "center", vertical="center")
                c.border = thin
        ws.append(["GENEL TOPLAM", total, ok_count, total - ok_count, f"%{pct}"])
        sr = ws.max_row
        for col in range(1, 6):
            c = ws.cell(sr, col)
            c.font = Font(bold=True, color="FFFFFF", size=11)
            c.fill = total_fill
            c.alignment = Alignment(horizontal="left" if col == 1 else "center", vertical="center")
            c.border = thin
        ws.append([])
        ws.append(["No", "Case ID", "Test Adi", "Beklenen Sonuc", "Tip", "Durum", "Detay"])
        for col in range(1, 8):
            c = ws.cell(ws.max_row, col)
            c.font = Font(bold=True, color="FFFFFF", size=11)
            c.fill = hdr_fill
            c.alignment = Alignment(horizontal="center", vertical="center")
            c.border = thin
        for i, row in enumerate(results, 1):
            cid, term, exp_a, exp_t, section, top_n, status, detail = row
            test_name = f'"{term}" aramasi yapilir'
            if exp_t.startswith("[Playlist] "):
                kw = exp_t[len("[Playlist] "):]
                exp_result = f"Ilk {top_n}'da '{kw}' playlist bulunmali."
            elif exp_a and not exp_t:
                exp_result = f"Ilk {top_n}'da '{exp_a}' sanatcisi bulunmali."
            else:
                parts = []
                if exp_a: parts.append(f"'{exp_a}'")
                if exp_t: parts.append(f"'{exp_t}'")
                exp_result = f"Top-{top_n} icinde {' - '.join(parts)} eslesmesi bulunmali."
            ws.append([i, cid, test_name, exp_result, section, status, detail])
            f = ok_fill if status == "OK" else nok_fill
            for col in range(1, 8):
                c = ws.cell(ws.max_row, col)
                c.fill = f
                c.alignment = Alignment(wrap_text=True, vertical="top")
                c.border = thin
        for col, w in zip("ABCDEFG", [6, 14, 28, 40, 26, 9, 55]):
            ws.column_dimensions[col].width = w
        ws.freeze_panes = "A3"
        os.makedirs(OUT_DIR, exist_ok=True)
        fname = f"TestReport_{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}.xlsx"
        fpath = os.path.join(OUT_DIR, fname)
        wb.save(fpath)
        print(f"Excel kaydedildi: {fpath}")
        return fpath, ok_count, total, pct

    def send_email(results, ok_count, total, pct, fpath):
        sec_ok  = Counter(r[4] for r in results if r[6] == "OK")
        sec_nok = Counter(r[4] for r in results if r[6] == "NOK")
        secs = sorted(set(list(sec_ok) + list(sec_nok)))
        date_str  = datetime.datetime.now().strftime("%d.%m.%Y %H:%M")
        icon_main = "BASARILI" if pct >= 80 else ("DIKKAT" if pct >= 70 else "BASARISIZ")
        icon_color = "#2e7d32" if pct >= 80 else ("#e65100" if pct >= 70 else "#b71c1c")
        table_rows = ""
        for s in secs:
            ok_c  = sec_ok.get(s, 0)
            tot_c = ok_c + sec_nok.get(s, 0)
            p = round(ok_c / tot_c * 100) if tot_c else 0
            bg = "#c8e6c9" if p >= 80 else "#ffcdd2"
            table_rows += (
                f'<tr style="background:{bg}">'
                f'<td style="padding:6px 10px">{s}</td>'
                f'<td style="padding:6px 10px;text-align:center">{tot_c}</td>'
                f'<td style="padding:6px 10px;text-align:center">{ok_c}</td>'
                f'<td style="padding:6px 10px;text-align:center">{tot_c - ok_c}</td>'
                f'<td style="padding:6px 10px;text-align:center">%{p}</td>'
                f'</tr>'
            )
        table_rows += (
            f'<tr style="background:#1f5c99;color:#fff;font-weight:bold">'
            f'<td style="padding:6px 10px">GENEL TOPLAM</td>'
            f'<td style="padding:6px 10px;text-align:center">{total}</td>'
            f'<td style="padding:6px 10px;text-align:center">{ok_count}</td>'
            f'<td style="padding:6px 10px;text-align:center">{total - ok_count}</td>'
            f'<td style="padding:6px 10px;text-align:center">%{pct}</td>'
            f'</tr>'
        )
        html = (
            f'<div style="font-family:Calibri,Arial,sans-serif;max-width:600px">'
            f'<h2 style="color:#1f5c99;margin-bottom:4px">MUUD Arama Test Raporu</h2>'
            f'<p style="margin:2px 0;color:#555">Tarih: {date_str}</p>'
            f'<p style="margin:2px 0"><b>Genel Sonuc:</b> <span style="color:{icon_color};font-weight:bold">{icon_main}</span></p>'
            f'<p style="margin:2px 0"><b>Basarili:</b> {ok_count}/{total} = %{pct}</p>'
            f'<br>'
            f'<table border="0" cellspacing="1" cellpadding="0" style="border-collapse:collapse;width:100%">'
            f'<tr style="background:#1f5c99;color:#fff">'
            f'<th style="padding:7px 10px;text-align:left">Kategori</th>'
            f'<th style="padding:7px 10px">Toplam</th>'
            f'<th style="padding:7px 10px">Basarili</th>'
            f'<th style="padding:7px 10px">Hata</th>'
            f'<th style="padding:7px 10px">Oran</th>'
            f'</tr>'
            f'{table_rows}'
            f'</table>'
            f'<p style="color:#888;font-size:12px;margin-top:12px">Excel raporu ektedir: {os.path.basename(fpath)}</p>'
            f'</div>'
        )
        msg = MIMEMultipart("alternative")
        msg["From"]    = MAIL_FROM
        msg["To"]      = MAIL_TO
        msg["Subject"] = f"MUUD Test Raporu - {date_str} - %{pct}"
        msg.attach(MIMEText(html, "html", "utf-8"))
        with open(fpath, "rb") as f:
            part = MIMEBase("application", "octet-stream")
            part.set_payload(f.read())
            encoders.encode_base64(part)
            part.add_header("Content-Disposition", f"attachment; filename={os.path.basename(fpath)}")
            msg.attach(part)
        try:
            with smtplib.SMTP(SMTP_HOST, SMTP_PORT, timeout=30) as s:
                s.ehlo()
                try:
                    s.starttls()
                    s.ehlo()
                except Exception:
                    pass
                try:
                    if SMTP_PASS:
                        s.login(SMTP_USER, SMTP_PASS)
                except Exception as auth_err:
                    print(f"Auth atildi, relay denenecek: {auth_err}")
                s.sendmail(MAIL_FROM, [m.strip() for m in MAIL_TO.split(',')], msg.as_string())
            print(f"Email gonderildi: {MAIL_TO}")
        except Exception as e:
            print(f"Email hatasi: {e}")

    def main():
        print(f"MUUD Test basliyor - {len(CASES)} case - {datetime.datetime.now()}")
        results = []
        for i, (cid, term, exp_a, exp_t, section, top_n) in enumerate(CASES):
            items = search_api(term, max(top_n + 5, TOP_N))
            status, detail = evaluate(cid, term, exp_a, exp_t, section, top_n, items)
            results.append((cid, term, exp_a, exp_t, section, top_n, status, detail))
            if (i + 1) % 20 == 0:
                print(f"  [{i+1}/{len(CASES)}] devam ediyor...")
        fpath, ok_count, total, pct = write_excel(results)
        send_email(results, ok_count, total, pct, fpath)
        print(f"TAMAMLANDI: {ok_count}/{total} = %{pct}")

    if __name__ == "__main__":
        main()